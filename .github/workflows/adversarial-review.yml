name: Adversarial Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: adversarial-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Note missing review credential
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "::notice::ANTHROPIC_API_KEY is not set; skipping Adversarial Review."
      - uses: actions/checkout@v4
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          prompt: |
            Follow .claude/skills/adversarial-review/SKILL.md on this PR's diff (origin/${{ github.base_ref }}...HEAD) with two attack passes and a verify step. Do not edit files. Post only verified findings as one PR comment.
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
