name: Adversarial Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: adversarial-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Note missing review credential
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "::notice::ANTHROPIC_API_KEY is not set; skipping Adversarial Review."
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          prompt: |
            Follow .claude/skills/adversarial-review/SKILL.md on this PR's diff (run `gh pr diff` for the PR diff) with two attack passes and a verify step. Do not edit files. Post only verified findings as one PR comment.
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
