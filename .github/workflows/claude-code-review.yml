name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Note missing review credential
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN == '' }}
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping Claude Code Review."
      - uses: actions/checkout@v4
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      - uses: anthropics/claude-code-action@v1
        if: ${{ env.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/review'
          claude_args: '--allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
